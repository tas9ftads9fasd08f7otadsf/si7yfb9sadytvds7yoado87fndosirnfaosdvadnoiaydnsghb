name: Release

# Every merge publishes a build; the app takes one by its tag, with tools/update-web-editor.sh.
on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    # A called workflow gets no more than this; CI's change check reads pull requests.
    permissions:
      contents: read
      pull-requests: read

  release:
    name: Publish the bundle
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Two zips: the app takes web-editor.zip, the site's deploy web-site.zip.
      - name: Pack and publish
        id: publish
        run: |
          version="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${GITHUB_RUN_NUMBER}"
          npm run build
          WEB_EDITOR_VERSION="$version" npm run pack
          npm run build:web
          WEB_EDITOR_VERSION="$version" npm run pack:web
          gh release create "v$version" dist/web-editor.zip dist/web-editor.zip.sha256 \
            dist/web-site.zip dist/web-site.zip.sha256 \
            --target "$GITHUB_SHA" --title "v$version" --generate-notes
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy the site
    needs: release
    uses: ./.github/workflows/deploy-site.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
    permissions:
      contents: read
