name: Release

# Every merge publishes a build; the app takes one by its tag, with tools/update-web-editor.sh.
on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    # A called workflow gets no more than this; CI's change check reads pull requests.
    permissions:
      contents: read
      pull-requests: read

  # The site ships riki-core.wasm, built from the pinned rikimaps commit.
  core:
    name: Build the core
    uses: ./.github/workflows/core.yml
    secrets:
      RIKIMAPS_READ_TOKEN: ${{ secrets.RIKIMAPS_READ_TOKEN }}
    permissions:
      contents: read

  release:
    name: Publish the bundle
    needs: [check, core]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Not there while rikiCore.ref pins no commit: pack:web says so, and the deploy refuses such a zip.
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: riki-core
          path: dist/riki-core
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: riki-words
          path: dist/words
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: riki-assets
          path: dist/assets
      # Two zips: the app takes web-editor.zip, the site's deploy web-site.zip.
      - name: Pack and publish
        id: publish
        run: |
          version="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${GITHUB_RUN_NUMBER}"
          npm run build
          WEB_EDITOR_VERSION="$version" npm run pack
          npm run build:web
          WEB_EDITOR_VERSION="$version" npm run pack:web
          gh release create "v$version" dist/web-editor.zip dist/web-editor.zip.sha256 \
            dist/web-site.zip dist/web-site.zip.sha256 \
            --target "$GITHUB_SHA" --title "v$version" --generate-notes
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  app:
    name: Update the app
    needs: release
    uses: ./.github/workflows/update-app.yml
    secrets:
      RIKIMAPS_ACTIONS_TOKEN: ${{ secrets.RIKIMAPS_ACTIONS_TOKEN }}
    permissions:
      contents: read

  deploy:
    name: Deploy the site
    needs: release
    uses: ./.github/workflows/deploy-site.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
    permissions:
      contents: read
