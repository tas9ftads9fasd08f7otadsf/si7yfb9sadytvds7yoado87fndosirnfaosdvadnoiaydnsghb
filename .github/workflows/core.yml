name: Core

# riki-core.wasm, the site's words, glyphs and sprite, made from the rikimaps commit package.json pins (rikiCore.ref):
# scripts/build-core.mjs and scripts/build-words.mjs. Release calls
# this before it packs the site; a pull request runs it when the pin or the build changes.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - package.json
      - scripts/build-core.mjs
      - scripts/build-assets.mjs
      - .github/workflows/core.yml
  workflow_call:
    secrets:
      RIKIMAPS_READ_TOKEN:
        description: A token that reads skifahrer/rikimaps, which is private
        required: false
  # 146 A run by hand may name a rikimaps branch or commit, to test a core cut on Linux before it merges.
  workflow_dispatch:
    inputs:
      ref:
        description: A rikimaps branch or commit; the pinned one when empty
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: core-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  core:
    name: Build riki-core.wasm
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - id: pin
        name: Read the pinned commit
        env:
          ASKED: ${{ inputs.ref }}
        run: echo "ref=${ASKED:-$(node -p "require('./package.json').rikiCore.ref || ''")}" >> "$GITHUB_OUTPUT"

      # Private: the token is the repository secret RIKIMAPS_READ_TOKEN, which skifahrer creates.
      - name: Check out rikimaps at the pinned commit
        if: steps.pin.outputs.ref != ''
        uses: actions/checkout@v5
        with:
          repository: skifahrer/rikimaps
          ref: ${{ steps.pin.outputs.ref }}
          token: ${{ secrets.RIKIMAPS_READ_TOKEN }}
          path: rikimaps
          persist-credentials: false

      - name: Cache the Swift toolchain
        uses: actions/cache@v5
        with:
          path: ~/.cache/riki-swift
          key: riki-swift-6.2-RELEASE-ubuntu24.04-8e3d63a3
      - name: Cache the WebAssembly SDK
        uses: actions/cache@v5
        with:
          path: ~/.swiftpm/swift-sdks
          key: riki-swift-wasm-sdk-6.2-RELEASE-fe4e8648

      # A named branch is built as its commit, which has no sum to be held to.
      - name: Name the commit asked for
        if: inputs.ref != ''
        run: echo "RIKI_CORE_REF=$(git -C rikimaps rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build, optimise and load it
        env:
          RIKIMAPS_DIR: ${{ github.workspace }}/rikimaps
        run: npm run build:core

      # rikimaps runs none of these in its own CI: the core's Foundation-only files and the module's ABI tests.
      - name: Test the core at the pinned commit
        if: steps.pin.outputs.ref != ''
        env:
          SWIFT: ~/.cache/riki-swift/swift-6.2-RELEASE-ubuntu24.04/usr/bin/swift
        run: |
          SWIFT="${SWIFT/#\~/$HOME}" rikimaps/tools/linux-core-tests.sh

      - uses: actions/upload-artifact@v6
        with:
          name: riki-core
          path: dist/riki-core
          if-no-files-found: ignore

      # The site's words, from the same checkout: the key list and the .lproj tables.
      - name: Make the site's words
        if: steps.pin.outputs.ref != ''
        env:
          RIKIMAPS_DIR: ${{ github.workspace }}/rikimaps
        run: npm run build:words

      # The glyphs and the base sprite, from the same checkout: the app's Glyphs folder and temaki-sprite files.
      - name: Make the site's glyphs and sprite
        if: steps.pin.outputs.ref != ''
        env:
          RIKIMAPS_DIR: ${{ github.workspace }}/rikimaps
        run: npm run build:assets

      - uses: actions/upload-artifact@v6
        with:
          name: riki-assets
          path: dist/assets
          if-no-files-found: ignore

      # The generator the port replaced, at the commit its output is checked against (rikimaps' contract, §2).
      - name: Check out rikimaps where tools/site-words.py last made the words
        if: steps.pin.outputs.ref != ''
        uses: actions/checkout@v5
        with:
          repository: skifahrer/rikimaps
          ref: 5a7200c4fbea3ded11e7b9294e39bc35c0fd8ffe
          token: ${{ secrets.RIKIMAPS_READ_TOKEN }}
          path: rikimaps-words-check
          persist-credentials: false
      - name: Reproduce the generator's words
        if: steps.pin.outputs.ref != ''
        env:
          RIKIMAPS_DIR: ${{ github.workspace }}/rikimaps
          RIKIMAPS_WORDS_CHECK_DIR: ${{ github.workspace }}/rikimaps-words-check
        run: npx vitest run scripts/build-words.test.mjs

      - uses: actions/upload-artifact@v6
        with:
          name: riki-words
          path: dist/words
          if-no-files-found: ignore
