name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A pull request's new push replaces its last run; each merge's release runs to the end.
concurrency:
  group: ci-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  changes:
    name: Code or docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename') || files="" ;;
            push) files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename') || files="" ;;
            *) files="" ;;
          esac
          # an unknown change counts as code; compare lists at most 300 files
          if [ -n "$files" ] && [ "$(wc -l <<< "$files")" -lt 300 ] && ! grep -qvE '\.md$' <<< "$files"; then
            echo "::notice::only docs changed, so no tests run"
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: web-editor
          path: dist/web-editor.zip*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
