name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:

permissions:
  contents: read

# A pull request's new push replaces its last run; a merge's run is only cut short in `check`.
concurrency:
  group: ci-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  changes:
    name: Code or docs
    # A draft runs nothing; marking it ready starts the run.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename') || files="" ;;
            push) files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename') || files="" ;;
            *) files="" ;;
          esac
          # an unknown change counts as code; compare lists at most 300 files
          if [ -n "$files" ] && [ "$(wc -l <<< "$files")" -lt 300 ] && ! grep -qvE '\.md$' <<< "$files"; then
            echo "::notice::only docs changed, so no tests run"
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Lint, test and build
    # 71 A newer merge to master takes over from the tests still running; the release is not cut.
    concurrency:
      group: check-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # 132 The ISO week in a key makes a new cache each Monday, so none outlives a week.
      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache the packages
        id: modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      # The site's server: PHPUnit, with the runner's own PHP and Composer.
      - name: Cache the server's packages
        uses: actions/cache@v5
        with:
          path: server/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('server/composer.lock') }}
      - run: composer install --working-dir=server --no-interaction --no-progress
      - name: Cache pip's downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-ftps-${{ steps.week.outputs.week }}
      # The deploy script's test runs it on a stand-in FTPS server.
      - run: sudo apt-get update -q && sudo apt-get install -y -q lftp && pip install pyftpdlib pyopenssl
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:php
      - name: Cache the build's own cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      - run: npm run pack
      - run: npm run build:web
      # The browser specs answer riki-core.wasm with a stand-in; the real one is built by core.yml, for the release.
      - run: npm run pack:web
        env:
          RIKI_PACK_WITHOUT_CORE: "1"
      - uses: actions/upload-artifact@v6
        with:
          name: web-editor
          path: dist/web-editor.zip*
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: web-site
          path: dist/web-site.zip*
          if-no-files-found: error

  # 139 The browser specs share one stand-in phone, so each runner takes a share of them with its own.
  browser:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Browser tests (${{ matrix.target }} ${{ matrix.shard }})
    concurrency:
      group: browser-${{ github.head_ref || github.ref }}-${{ matrix.target }}-${{ matrix.shard }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: phone, shard: 1/4 }
          - { target: phone, shard: 2/4 }
          - { target: phone, shard: 3/4 }
          - { target: phone, shard: 4/4 }
          - { target: web, shard: 1/2 }
          - { target: web, shard: 2/2 }
    env:
      RIKI_TARGET: ${{ matrix.target == 'web' && 'web' || '' }}
    steps:
      - uses: actions/checkout@v5
      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache the packages
        id: modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Cache the server's packages
        uses: actions/cache@v5
        with:
          path: server/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('server/composer.lock') }}
      - run: composer install --working-dir=server --no-interaction --no-progress
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright's browser
        id: browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ steps.week.outputs.week }}
      # Its system libraries come from apt every run; the browser only on a miss.
      - if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browser.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Cache the build's own cache
        uses: actions/cache/restore@v5
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - if: matrix.target == 'phone'
        run: npm run build
      - if: matrix.target == 'web'
        run: npm run build:web && npm run pack:web
        env:
          RIKI_PACK_WITHOUT_CORE: "1"
      - run: npx playwright test --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: playwright-report-${{ matrix.target }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
