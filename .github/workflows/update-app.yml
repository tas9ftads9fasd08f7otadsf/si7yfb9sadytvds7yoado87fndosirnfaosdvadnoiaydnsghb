name: Update the app

# Riki Maps' web-editor workflow opens the pull request moving its bundle to our newest release.
on:
  workflow_call:
    secrets:
      RIKIMAPS_READ_TOKEN:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: Ask Riki Maps for a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # GITHUB_TOKEN cannot reach another repository; a repository dispatch needs only contents: write.
      GH_TOKEN: ${{ secrets.RIKIMAPS_READ_TOKEN }}
    steps:
      - run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RIKIMAPS_READ_TOKEN is not set, so Riki Maps is not asked to update"
            exit 1
          fi
          gh api repos/skifahrer/rikimaps/dispatches -f event_type=web-editor-release
